plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.6'
}

group = 'com.qa.automation'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Playwright
    implementation 'com.microsoft.playwright:playwright:1.40.0'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit:7.14.0'
    testImplementation 'io.cucumber:cucumber-picocontainer:7.14.0'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    // Allure
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.25.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.25.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.12'

    // JSON para configuración
    implementation 'com.google.code.gson:gson:2.10.1'

    // WebDriverManager (opcional, para gestionar drivers)
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    // AssertJ para aserciones mejoradas
    testImplementation 'org.assertj:assertj-core:3.24.1'
}

tasks {
    test {
        useJUnitPlatform()
        systemProperty 'cucumber.execution.parallel.enabled', 'true'
        systemProperty 'allure.results.directory', 'target/allure-results'
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }
}

// ========== TASKS PARA GRABACIÓN CON PLAYWRIGHT INSPECTOR ==========

// Task para grabar tests con Playwright Inspector (PWDEBUG)
task recordTest {
    doLast {
        println("\n" + "=".repeat(60))
        println("🎬 INICIANDO GRABACIÓN CON PLAYWRIGHT INSPECTOR")
        println("=".repeat(60))
        println("1. Se abrirá el navegador y el Inspector simultáneamente")
        println("2. Realiza tus acciones manualmente (60 segundos)")
        println("3. El Inspector capturará el código Java automáticamente")
        println("4. Copia el código generado en tu test")
        println("=".repeat(60) + "\n")
        
        exec {
            environment 'PWDEBUG', '1'
            commandLine 'gradle', 'test', '--tests', 'com.qa.automation.recorder.RecorderTest.recordMyFirstTest'
        }
    }
}

// Task para grabar con tracing completo (screenshots, snapshots, eventos)
task recordTestWithTrace {
    doLast {
        println("\n" + "=".repeat(60))
        println("📹 INICIANDO GRABACIÓN CON TRACING COMPLETO")
        println("=".repeat(60))
        println("Se grabarán:")
        println("  ✓ Screenshots de cada acción")
        println("  ✓ Snapshots del DOM")
        println("  ✓ Eventos del navegador")
        println("  ✓ Código Java generado")
        println("\nResultado guardado en: target/trace.zip")
        println("=".repeat(60) + "\n")
        
        exec {
            environment 'PWDEBUG', 'console'
            commandLine 'gradle', 'test', '--tests', 'com.qa.automation.recorder.RecorderTest.recordWithTracing'
        }
    }
}

// Task para visualizar las grabaciones (traces)
task openTrace {
    doLast {
        println("\n" + "=".repeat(60))
        println("📺 ABRIENDO VISUALIZADOR DE TRACES")
        println("=".repeat(60) + "\n")
        
        exec {
            commandLine 'npx', 'playwright', 'show-trace', 'target/trace.zip'
        }
    }
}

// Task para grabar con configuración del proyecto
task recordTestWithConfig {
    doLast {
        println("\n" + "=".repeat(60))
        println("⚙️  GRABACIÓN CON CONFIGURACIÓN DEL PROYECTO")
        println("=".repeat(60))
        println("Usando URL base y configuración de config.json")
        println("=".repeat(60) + "\n")
        
        exec {
            environment 'PWDEBUG', '1'
            commandLine 'gradle', 'test', '--tests', 'com.qa.automation.recorder.RecorderTest.recordWithConfiguration'
        }
    }
}

// ========== TASKS EXISTENTES ==========

// Task para generar reporte Allure
task allureReport {
    doLast {
        exec {
            commandLine 'allure', 'generate', 'target/allure-results', '-o', 'target/allure-report', '--clean'
        }
    }
}

// Task para abrir reporte Allure
task openAllureReport {
    doLast {
        exec {
            commandLine 'allure', 'open', 'target/allure-report'
        }
    }
}

// Task para limpiar y ejecutar tests
task runTests {
    dependsOn 'clean', 'test'
}

// Task para ejecutar solo features específicas
task runFeature(type: Test) {
    useJUnitPlatform()
    systemProperty 'allure.results.directory', 'target/allure-results'
    if (project.hasProperty('feature')) {
        systemProperty 'cucumber.filter.tags', "@${project.property('feature')}"
    }
}
